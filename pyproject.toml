[project]
name = "innodata-assignment"
version = "0.1.0"
description = "GenAI-powered XML proofreader that injects <error> tags into <p> elements while preserving exact text length."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "lxml>=5.2",
    "openai>=1.40",
    "python-dotenv>=1.0",
]

[project.scripts]
proofread = "proofread.__main__:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["proofread"]
